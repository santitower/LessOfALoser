name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run deterministic wellness engine tests
        run: swift test
      - name: Run private gateway tests
        run: python3 -m unittest discover -s desktop_gateway/tests -v

  web-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - name: Install web review dependencies
        run: npm ci
      - name: Lint web review
        run: npm run lint
      - name: Build and test web review
        run: npm test

  ios-build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode toolchain
        run: xcodebuild -version
      - name: Build standard iOS app
        run: >-
          xcodebuild
          -project LessOfALoser.xcodeproj
          -scheme LessOfALoser
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build experimental Core AI app
        run: >-
          xcodebuild
          -project LessOfALoser.xcodeproj
          -scheme LessOfALoser-CoreAI
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
